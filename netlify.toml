# Netlify configuration for HeartBeat@ITER
[build]
  # Build command - runs from root, builds frontend
  command = "cd frontend && yarn install && yarn build"
  
  # Directory to publish (where the built files are)
  publish = "frontend/dist"
  
  # Environment variables for build
  [build.environment]
    NODE_VERSION = "18"

# Redirects for Single Page Application (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Error pages
[[redirects]]
  from = "/404"
  to = "/index.html"
  status = 200