<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Android Notification Bell Position Test - Comprehensive</title>
    <style>
        /* Import the actual CSS from the app */
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #533483 100%);
            color: white;
            min-height: 100vh;
        }
        
        /* Replicate the exact header structure from Index.tsx */
        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
        }
        
        .spacer {
            width: 32px;
            flex-shrink: 0;
        }
        
        .logo-container {
            position: relative;
            flex: 1;
            min-width: 0;
            text-align: center;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #a855f7, #06b6d4, #eab308);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .notification-container {
            width: 32px;
            flex-shrink: 0;
            display: flex;
            justify-content: end;
        }
        
        /* Replicate the exact NotificationBell component styles */
        .notification-bell-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .notification-bell {
            position: relative;
            width: 40px;
            height: 40px;
            border: none;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
        }
        
        .notification-bell:hover {
            background: rgba(255,255,255,0.2);
            transform: scale(1.05);
        }
        
        .notification-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ef4444;
            color: white;
            width: 20px;
            height: 20px;
            min-width: 1.25rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid #0f0f23;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 20;
        }
        
        /* Android-specific fixes - exact copy from index.css */
        @supports (-webkit-touch-callout: none) {
            .notification-bell-container {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }
        
        @media screen and (-webkit-min-device-pixel-ratio: 0) {
            .notification-bell-container {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                transform: translateZ(0); /* Force hardware acceleration */
            }
            
            .notification-badge-android {
                position: absolute !important;
                top: -0.5rem !important;
                right: -0.5rem !important;
                transform: translate(50%, -50%) !important;
                z-index: 10;
            }
        }
        
        @media screen and (max-width: 768px) {
            .mobile-notification-fix {
                position: relative;
                overflow: visible;
            }
            
            .mobile-notification-fix .notification-badge {
                position: absolute;
                top: -8px;
                right: -8px;
                transform: none;
                z-index: 20;
            }
        }
        
        /* Test results styling */
        .test-results {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
        }
        
        .test-item {
            margin: 10px 0;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            border-left: 4px solid #10b981;
        }
        
        .test-item.warning {
            border-left-color: #f59e0b;
        }
        
        .test-item.error {
            border-left-color: #ef4444;
        }
        
        .measurement {
            font-family: monospace;
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
        }
        
        .viewport-info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 8px;
            border-radius: 6px;
            font-size: 12px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="viewport-info" id="viewportInfo">
        Viewport: <span id="viewportSize"></span>
    </div>
    
    <h1>🔔 Android Notification Bell Position Test</h1>
    <p>Testing the exact implementation from the Heartbeat@Campus app</p>
    
    <!-- Exact header structure from Index.tsx -->
    <div class="header-container">
        <div class="spacer"></div>
        
        <div class="logo-container">
            <div class="logo">⚡ Heartbeat@Campus</div>
        </div>
        
        <div class="notification-container">
            <div class="notification-bell-container mobile-notification-fix">
                <button class="notification-bell">
                    🔔
                    <span class="notification-badge notification-badge-android mobile-notification-fix">5</span>
                </button>
            </div>
        </div>
    </div>
    
    <div class="test-results">
        <h2>🧪 Test Results</h2>
        <div id="testResults"></div>
    </div>

    <script>
        function updateViewportInfo() {
            document.getElementById('viewportSize').textContent = 
                `${window.innerWidth}x${window.innerHeight}`;
        }
        
        function runPositioningTests() {
            const results = [];
            
            // Get elements
            const bell = document.querySelector('.notification-bell');
            const badge = document.querySelector('.notification-badge');
            const container = document.querySelector('.notification-container');
            const header = document.querySelector('.header-container');
            
            if (!bell || !badge || !container || !header) {
                results.push({
                    type: 'error',
                    title: 'Missing Elements',
                    content: 'Could not find required elements for testing'
                });
                return results;
            }
            
            // Get bounding boxes
            const bellRect = bell.getBoundingClientRect();
            const badgeRect = badge.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            const headerRect = header.getBoundingClientRect();
            
            // Test 1: Bell button positioning
            const viewportWidth = window.innerWidth;
            const bellRightEdge = bellRect.right;
            const bellWithinViewport = bellRightEdge <= viewportWidth;
            
            results.push({
                type: bellWithinViewport ? 'success' : 'error',
                title: 'Bell Button Viewport Bounds',
                content: `Bell right edge: <span class="measurement">${bellRightEdge.toFixed(1)}px</span>, Viewport width: <span class="measurement">${viewportWidth}px</span><br>
                         ${bellWithinViewport ? '✅ Within bounds' : '❌ Extends beyond viewport'}`
            });
            
            // Test 2: Bell positioning on right side
            const bellOnRightSide = bellRect.left > viewportWidth * 0.5;
            results.push({
                type: bellOnRightSide ? 'success' : 'warning',
                title: 'Bell Right-Side Positioning',
                content: `Bell left position: <span class="measurement">${bellRect.left.toFixed(1)}px</span> (should be > ${(viewportWidth * 0.5).toFixed(1)}px)<br>
                         ${bellOnRightSide ? '✅ Correctly positioned on right' : '⚠️ Not on right side'}`
            });
            
            // Test 3: Badge positioning relative to bell
            const expectedBadgeX = bellRect.right - 8;
            const expectedBadgeY = bellRect.top - 8;
            const badgeXCorrect = Math.abs(badgeRect.left - expectedBadgeX) <= 5;
            const badgeYCorrect = Math.abs(badgeRect.top - expectedBadgeY) <= 5;
            
            results.push({
                type: (badgeXCorrect && badgeYCorrect) ? 'success' : 'error',
                title: 'Badge Positioning (-8px offset)',
                content: `Expected: <span class="measurement">x≈${expectedBadgeX.toFixed(1)}, y≈${expectedBadgeY.toFixed(1)}</span><br>
                         Actual: <span class="measurement">x=${badgeRect.left.toFixed(1)}, y=${badgeRect.top.toFixed(1)}</span><br>
                         ${badgeXCorrect && badgeYCorrect ? '✅ Correctly positioned' : '❌ Positioning incorrect'}`
            });
            
            // Test 4: Badge viewport bounds
            const badgeWithinViewport = badgeRect.right <= viewportWidth && badgeRect.top >= 0;
            results.push({
                type: badgeWithinViewport ? 'success' : 'error',
                title: 'Badge Viewport Bounds',
                content: `Badge bounds: <span class="measurement">right=${badgeRect.right.toFixed(1)}, top=${badgeRect.top.toFixed(1)}</span><br>
                         ${badgeWithinViewport ? '✅ Within viewport' : '❌ Extends beyond viewport'}`
            });
            
            // Test 5: Container flex layout
            const containerStyle = getComputedStyle(container);
            const containerFlexCorrect = containerStyle.display === 'flex' && 
                                       containerStyle.justifyContent === 'end' &&
                                       containerStyle.flexShrink === '0';
            
            results.push({
                type: containerFlexCorrect ? 'success' : 'warning',
                title: 'Container Flex Layout',
                content: `Display: <span class="measurement">${containerStyle.display}</span>, 
                         Justify: <span class="measurement">${containerStyle.justifyContent}</span>, 
                         Flex-shrink: <span class="measurement">${containerStyle.flexShrink}</span><br>
                         ${containerFlexCorrect ? '✅ Correct flex layout' : '⚠️ Layout may need adjustment'}`
            });
            
            // Test 6: Android-specific CSS classes
            const hasAndroidClasses = badge.classList.contains('notification-badge-android') &&
                                    badge.classList.contains('mobile-notification-fix');
            
            results.push({
                type: hasAndroidClasses ? 'success' : 'warning',
                title: 'Android CSS Classes',
                content: `Classes: <span class="measurement">${badge.className}</span><br>
                         ${hasAndroidClasses ? '✅ Android classes applied' : '⚠️ Missing Android classes'}`
            });
            
            // Test 7: Hardware acceleration
            const bellContainerStyle = getComputedStyle(document.querySelector('.notification-bell-container'));
            const hasHardwareAcceleration = bellContainerStyle.transform !== 'none';
            
            results.push({
                type: hasHardwareAcceleration ? 'success' : 'warning',
                title: 'Hardware Acceleration',
                content: `Transform: <span class="measurement">${bellContainerStyle.transform}</span><br>
                         ${hasHardwareAcceleration ? '✅ Hardware acceleration active' : 'ℹ️ No transform detected'}`
            });
            
            return results;
        }
        
        function displayResults(results) {
            const container = document.getElementById('testResults');
            container.innerHTML = '';
            
            results.forEach(result => {
                const div = document.createElement('div');
                div.className = `test-item ${result.type}`;
                div.innerHTML = `
                    <strong>${result.title}</strong><br>
                    ${result.content}
                `;
                container.appendChild(div);
            });
        }
        
        function runTests() {
            updateViewportInfo();
            const results = runPositioningTests();
            displayResults(results);
            
            // Log results to console for automated testing
            console.log('Android Notification Bell Test Results:', results);
            
            return results;
        }
        
        // Run tests on load and resize
        window.addEventListener('load', runTests);
        window.addEventListener('resize', runTests);
        
        // Click handler for bell
        document.querySelector('.notification-bell').addEventListener('click', function() {
            alert('🔔 Notification bell clicked! Position test completed.');
        });
        
        // Initial run
        runTests();
    </script>
</body>
</html>
